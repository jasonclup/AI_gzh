<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章编辑器 - 微信公众号爆款内容系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f7fa;color:#333}

/* Header */
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:18px;font-weight:600}
.header .nav-links{display:flex;gap:8px;margin-left:auto}
.header .nav-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.header .nav-btn:hover{background:rgba(255,255,255,.3)}

/* Main container */
.container{max-width:1300px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

/* LEFT: Preview Panel */
.preview-panel{position:sticky;top:72px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.pv-head{padding:12px 16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.pv-badge{font-size:11px;background:#ecfdf5;color:#059669;padding:3px 10px;border-radius:10px}
.pv-body{padding:20px;max-height:82vh;overflow-y:auto}

/* Cover image area */
.cover-area{border-radius:10px;height:180px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e293b,#334155);overflow:hidden;position:relative;border:1.5px solid #334155}
.cover-area img{width:100%;height:100%;object-fit:cover}
.cover-area .placeholder-text{color:#94a3b8;font-size:13px;text-align:center;z-index:1}

.pv-title{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:6px;color:#1e293b}
.pv-meta{font-size:12px;color:#9ca3af;margin-bottom:18px}

/* Paragraphs in preview */
.pv-para{margin-bottom:16px;line-height:1.9;font-size:14.5px;color:#374151;text-align:justify;padding:8px 12px;border-radius:6px}
.pv-para:hover{background:#f8fafc}

/* Highlight styles */
.hl-bold{font-weight:700!important;color:#dc2626!important;font-size:1.05em}
.hl-key{background:linear-gradient(120deg,#fef3c7 0%,#fde68a 100%);padding:1px 5px;border-radius:3px;font-weight:700;color:#92400e}
.hl-important{border-left:3px solid #667eea;padding-left:8px;background:#f0f4ff;color:#3730a3;font-weight:600}
.hl-emphasis{color:#7c3aed;font-weight:700;font-style:italic}

/* Image in preview */
.pv-image{margin:12px 0;border-radius:10px;overflow:hidden;max-height:400px;background:#1e293b}
.pv-image img{width:100%;height:auto;display:block;border-radius:10px}
.img-placeholder{height:200px;display:flex;align-items:center;justify-content:center;background:#f1f5f9;border:2px dashed #cbd5e1;border-radius:10px;color:#94a3b8;font-size:13px;cursor:pointer;transition:.2s}
.img-placeholder:hover{border-color:#667eea;color:#667eea;background:#f0f4ff}
.img-generating{height:200px;display:flex;align-items:center;justify-content:center;background:#fafafa;border-radius:10px;color:#667eea;font-size:13px}
.img-generating::after{content:'';display:inline-block;width:18px;height:18px;margin-left:8px;border:3px solid #ddd;border-top-color:#667eea;border-radius:50%;animation:spin .7s linear infinite}

.empty-preview{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-preview .big-icon{font-size:48px;margin-bottom:12px}

/* === RIGHT: Editor Panel === */
.edit-panel{background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.ed-head{padding:14px 18px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Title input */
.ed-title-input{flex:1;min-width:180px;padding:8px 14px;border:2px solid #e5e7eb;border-radius:8px;font-size:15px;outline:none;transition:.2s}
.ed-title-input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.15)}

/* Style selector */
.style-select{padding:8px 12px;border:2px solid #e5e7eb;border-radius:8px;font-size:13px;outline:none;cursor:pointer;background:#fff;transition:.2s}
.style-select:focus{border-color:#667eea}
.style-select option{padding:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:.2s}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-outline{background:#fff;border:1.5px solid #e5e7eb;color:#555}
.btn-outline:hover{border-color:#667eea;color:#667eea;background:#f8aff}
.btn-success{background:#059669;color:#fff}
.btn-success:hover{background:#047857}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.gen-info{display:flex;gap:14px;font-size:12px;color:#888;margin-left:auto}

/* Editor body */
.ed-body{padding:16px}
.ed-section{margin-bottom:16px;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;transition:.2s}
.ed-section:hover{border-color:#c7d2fe;box-shadow:0 2px 8px rgba(102,126,234,.08)}
.sec-header{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:linear-gradient(to right,#f8faff,#fff);border-bottom:1px solid #e5e7eb}
.sec-type{font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px}
.type-opening{background:#dbeafe;color:#1d4ed8}
.type-body{background:#f0fdf4;color:#15803d}
.type-closing{background:#fef3c7;color:#b45309}
.sec-chars{font-size:11px;color:#9ca3af}
.sec-actions{display:flex;gap:6px}
.sec-btn{font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;border:1px solid #e5e7eb;background:#fff;transition:.2s}
.sec-btn:hover{background:#f0f4ff;border-color:#667eea;color:#667eea}
.sec-textarea{width:100%;min-height:90px;padding:14px;border:none;outline:none;font-size:14px;line-height:1.85;resize:vertical;font-family:inherit;background:transparent}

/* Image section */
.img-hint-box{padding:10px 14px;background:#fffbeb;border-top:1px solid #e5e7eb;font-size:12px;color:#92400e;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.img-hint-box .gen-img-btn{margin-left:auto;padding:4px 10px;background:#667eea;color:#fff;border-radius:6px;font-size:11px;cursor:pointer;border:none;white-space:nowrap}
.img-hint-box .gen-img-btn:hover{background:#5a6fd6}
.img-hint-box .gen-img-btn.generating{background:#94a3b8;cursor:wait}
.gen-img-display{padding:8px 14px;background:#f8fafc;border-top:1px solid #e5e7eb}
.gen-img-display img{max-width:100%;border-radius:8px;border:1px solid #e5e7eb}

/* Tags & summary */
.info-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.info-chip{font-size:12px;padding:4px 12px;border-radius:14px;background:linear-gradient(135deg,#f0f4ff,#e0e7ff);color:#667eea;font-weight:500;border:1px solid #c7d2fe}
.summary-text{font-size:13px;color:#555;background:#fafafa;padding:12px 16px;border-radius:8px;line-height:1.6;border:1px solid #f0f0f0}

/* Loading overlay */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner-lg{width:40px;height:40px;border:4px solid #ddd;border-top-color:#667eea;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{margin-top:16px;color:#fff;font-size:15px;background:rgba(0,0,0,.5);padding:12px 24px;border-radius:10px}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{background:#059669}
.toast.error{background:#dc2626}

.empty-state{text-align:center;padding:40px 20px;color:#9ca3af}
.empty-state .big-icon{font-size:36px;margin-bottom:12px}
.topic-row{margin-top:16px;display:flex;gap:8px;justify-content:center}
.topic-row input{padding:10px 16px;border:2px solid #e5e7eb;border-radius:8px;width:65%;font-size:14px;outline:none;transition:.2s}
.topic-row input:focus{border-color:#667eea}

/* Auto-image status indicator */
.auto-img-status{font-size:11px;color:#059669;display:flex;align-items:center;gap:4px;margin-left:8px}

@media(max-width:900px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header">
    <div class="nav-links">
        <a class="nav-btn" href="/">🏠 首页</a>
        <a class="nav-btn" href="/topics">🔥 热门话题</a>
    </div>
    <h1>✏️ 文章编辑器</h1>
</div>

<div class="container">

<!-- LEFT: Preview -->
<div class="preview-panel">
<div class="pv-head">📱 文章预览 <span class="pv-badge">公众号样式</span></div>
<div class="pv-body" id="previewArea">
    <div class="empty-preview" id="emptyPreview">
        <div class="big-icon">📝</div>
        <div>选择一个话题并点击「生成文章」</div>
        <div style="font-size:12px;color:#bbb;margin-top:8px">一键完成：自动写作 + 自动配图</div>
    </div>
</div>
</div>

<!-- RIGHT: Editor -->
<div class="edit-panel">
<div class="ed-head">
    <input type="text" class="ed-title-input" id="titleInput" placeholder="文章标题（输入或生成后自动填充）">
    
    <select class="style-select" id="styleSelect" title="选择写作风格">
        <option value="objective">📊 客观分析</option>
        <option value="deep">🔍 深度解读</option>
        <option value="hot_commentary">🔥 热点评论</option>
        <option value="popular_science">📚 科普讲解</option>
    </select>
    
    <button class="btn btn-primary" id="genBtn" onclick="doGenerate()">🚀 生成文章</button>
    <button class="btn btn-success" onclick="copyArticle()">📋 复制全文</button>
    <span id="wordCountInfo" class="gen-info"></span>
</div>

<div class="ed-body" id="editorBody">
    <div class="empty-state">
        <div class="big-icon">✍️</div>
        <div>一键生成：文章 + 配图，全自动</div>
        <div class="topic-row">
            <input type="text" id="topicInput" placeholder="输入话题..." 
                   onkeydown="if(event.key==='Enter')doGenerate()">
            <button class="btn btn-primary" onclick="doGenerate()" style="vertical-align:middle">生成</button>
        </div>
    </div>
</div>

<!-- Tags row (shown after generation) -->
<div id="infoRow" style="display:none;padding:0 18px 14px;">
    <div class="info-row" id="tagChips"></div>
    <div class="summary-text" id="summaryText"></div>
</div>

</div><!-- edit-panel -->

</div><!-- container -->

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div style="text-align:center">
        <div class="spinner-lg"></div>
        <div class="loading-msg" id="loadingMsg">AI 正在分析话题并撰写文章...</div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
let currentArticle = null;
let currentTopic = '';
let currentStyle = 'objective';
let isGenerating = false;

// ══════════════════════════════════
//  生成文章（一键完成：文章+图片）
// ══════════════════════════════════
function doGenerate(){
    if(isGenerating){return;} // 防止重复点击
    
    const topic = document.getElementById('topicInput').value.trim();
    if(!topic){showToast('请先输入或选择一个话题','error');return;}

    currentTopic = topic;
    currentStyle = document.getElementById('styleSelect').value;
    const title = document.getElementById('titleInput').value.trim() || topic;
    
    // 设置加载状态
    isGenerating = true;
    showLoading(true);
    
    var btn=document.getElementById('genBtn');
    btn.disabled=true;
    btn.innerHTML='⏳ 生成中...';
    
    const styleNames={
        'objective':'客观分析',
        'deep':'深度解读',
        'hot_commentary':'热点评论',
        'popular_science':'科普讲解'
    };
    document.getElementById('loadingMsg').textContent 
        = '正在以「' + (styleNames[currentStyle]||currentStyle) + '」风格生成文章和配图...';

    var controller=new AbortController();
    var timer=setTimeout(function(){controller.abort();},30000); // 30秒超时

    fetch('/api/article/generate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:controller.signal,
        body:JSON.stringify({
            topic:topic,
            title:title,
            selected_title:'',
            extra_context:'',
            style:currentStyle,
            auto_images:true  // 开启自动配图
        }),
    })
    .then(function(r){
        clearTimeout(timer);
        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.json();
    })
    .then(function(d){
        showLoading(false);
        
        // ★ 关键修复：无论成功失败都要恢复按钮状态
        isGenerating = false;
        btn.disabled=false;
        btn.innerHTML='🔄 重新生成';
        
        if(d.success&&d.data){
            currentArticle=d.data;
            
            // 显示图片数量
            var imgCount=0;
            d.data.paragraphs.forEach(function(p){if(p.hasImage&&p.imageUrl)imgCount++;});
            var statusHtml=imgCount>0?'<span class="auto-img-status">🖼️ '+imgCount+'张配图已就绪</span>':'';
            
            renderEditor(d.data);
            renderPreview(d.data);
            document.getElementById('infoRow').style.display='block';
            showToast('✅ 文章生成成功！'+(imgCount>0?' 已自动配图 '+imgCount+' 张':''),'success');
        }else{
            showToast((d.error||'生成失败'),'error');
        }
    })
    .catch(function(err){
        clearTimeout(timer);
        showLoading(false);
        isGenerating = false;
        btn.disabled=false;
        btn.innerHTML='🚀 生成文章'; // 失败恢复为初始状态
        console.error(err);
        showToast('⚠️ 生成失败：'+err.message,'error');
    });
}

// ══════════════════════════════════
//  渲染编辑器
// ══════════════════════════════════
function renderEditor(article){
    document.getElementById('titleInput').value=article.title||'';
    document.getElementById('wordCountInfo').textContent=
        article.word_count+' 字 · '+article.paragraphs.length+' 段'
        +(article.style?' · '+article.style:'');
    
    // Tags
    var tagsEl=document.getElementById('tagChips');
    if(article.tags&&article.tags.length){
        tagsEl.innerHTML='<strong style="font-size:12px;color:#888;">标签：</strong>'
            +article.tags.map(function(t){return '<span class="info-chip">'+t+'</span>';}).join('');
    }
    
    // Summary
    if(article.summary){
        document.getElementById('summaryText').innerHTML='<strong style="font-size:12px;color:#888;">摘要：</strong>'+article.summary;
    }

    // Paragraphs with images
    var html='';
    article.paragraphs.forEach(function(p,i){
        var typeCls={'opening':'type-opening','body':'type-body','closing':'type-closing'}[p.type]||'type-body';
        var typeName={'opening':'开头','body':'正文','ending':'结尾'}[p.type]||'正文';
        
        // Image section - show existing or generate button
        var imgSection='';
        if(p.hasImage&&p.imageUrl){
            // Already has image - display it
            imgSection='<div class="gen-img-display" style="display:block"><img src="'+p.imageUrl+'" alt="配图'+(i+1)+'" style="max-width:100%;border-radius:8px">'
                +'<div style="margin-top:4px;display:flex;gap:6px;justify-content:flex-end">'
                +'<button class="gen-img-btn" onclick="generateImage('+i+',this)">🎨 换一张</button>'
                +'</div></div>';
        }else if(p.image_hint){
            // No image yet - show generate button
            imgSection='<div class="img-hint-box">'
                +'🖼️ 配图：<span style="color:#666">'+escapeHtml(p.image_hint)+'</span>'
                +'<button class="gen-img-btn" onclick="generateImage('+i+',this)">🎨 生成配图</button>'
                +'</div>'
                +'<div class="gen-img-display" id="imgDisplay'+i+'" style="display:none"></div>';
        }
        
        html+='<div class="ed-section" id="section'+i+'">'
            +'<div class="sec-header">'
                +'<span class="sec-type '+typeCls+'">第'+(i+1)+'段 · '+typeName+'</span>'
                +'<span class="sec-chars">'+(p.char_count||p.text.length)+'字</span>'
                +(p.highlights&&p.highlights.length?'<span style="font-size:10px;color:#dc2626;margin-left:4px">● '+p.highlights.length+'处重点</span>':'')
                +(p.hasImage&&p.imageUrl?'<span class="auto-img-status">🖼️</span>':'')
                +'<div class="sec-actions">'
                    +'<button class="sec-btn" title="加粗选中文字" onclick="wrapSelection('+i+',\'bold\')">B</button>'
                    +'<button class="sec-btn" title="标记为重点" onclick="wrapSelection('+i+',\'highlight\')">★</button>'
                +'</div>'
            +'</div>'
            +'<textarea class="sec-textarea" rows="'+Math.max(3,Math.ceil((p.text||'').length/35))+'"'
                      +' onchange="updatePara('+i+',this.value)" '
                      +'onkeyup="updatePreviewLive('+i+')" id="textarea'+i+'">'+escapeHtml(p.text||'')+'</textarea>'
            +imgSection
        +'</div>';
    });
    
    document.getElementById('editorBody').innerHTML=html;
}

function updatePara(i,newVal){
    if(currentArticle&&currentArticle.paragraphs[i]){
        currentArticle.paragraphs[i].text=newVal;
        currentArticle.paragraphs[i].char_count=newVal.length;
        renderPreview(currentArticle);
        updateWordCount();
    }
}

function updatePreviewLive(i){
    if(currentArticle&&currentArticle.paragraphs[i]){
        var ta=document.getElementById('textarea'+i);
        if(ta){
            currentArticle.paragraphs[i].text=ta.value;
            currentArticle.paragraphs[i].char_count=ta.value.length;
            updateSingleParaPreview(i,ta.value);
        }
        updateWordCount();
    }
}

function wrapSelection(i,type){
    var ta=document.getElementById('textarea'+i);
    if(!ta)return;
    var start=ta.selectionStart,end=ta.selectionEnd;
    if(start===end)return;
    var selected=ta.value.substring(start,end);
    var wrapped=(type==='bold')? '**'+selected+'**' : '【★】'+selected+'【/★】';
    ta.value=ta.value.substring(0,start)+wrapped+ta.value.substring(end);
    ta.focus();
    ta.setSelectionRange(start,start+wrapped.length);
    updatePara(i,ta.value);
}

// ══════════════════════════════════
//  渲染预览（重点高亮）
// ══════════════════════════════════
function renderPreview(article){
    var el=document.getElementById('previewArea');
    
    // Cover
    var coverHtml='<div class="cover-area">';
    if(article.cover_image_url){
        coverHtml+='<img src="'+article.cover_image_url+'" alt="封面" loading="lazy">';
    }else{
        coverHtml+='<div class="placeholder-text">📷 封面图<br><small>'+escapeHtml(article.cover_image_hint||'点击生成封面图')+'</small></div>';
    }
    coverHtml+='</div>';
    
    // Title & meta
    coverHtml+='<h1 class="pv-title">'+escapeHtml(article.title||'')+'</h1>';
    coverHtml+='<div class="pv-meta">'+escapeHtml(article.author||'AI观察者')+' · '+new Date().toLocaleDateString('zh-CN')+(article.style?' · '+article.style:'')+'</div>';
    
    // Paragraphs with highlight rendering and images
    article.paragraphs.forEach(function(p,idx){
        coverHtml+='<div class="pv-para">'+renderHighlightedText(p.text)+'</div>';
        
        // Show image if exists
        if(p.hasImage&&p.imageUrl){
            coverHtml+='<div class="pv-image"><img src="'+p.imageUrl+'" alt="配图'+(idx+1)+'" loading="lazy"></div>';
        }else if(p.image_hint){
            coverHtml+='<div class="img-placeholder" onclick="generateImage('+idx+')">🖼️ 点击生成配图<br><small>'+escapeHtml(p.image_hint)+'</small></div>';
        }
    });
    
    el.innerHTML=coverHtml;
}

function updateSingleParaPreview(i,text){
    var paras=document.querySelectorAll('.pv-para');
    if(paras&&paras[i]){
        paras[i].innerHTML=renderHighlightedText(text);
    }
}

/** 高亮渲染规则：
 * **文字** → 红色加粗 (hl-bold)
 * 【★】文字【/★】 → 黄底强调 (hl-key)
 * "关键在于"/"核心是"等 → 紫色斜体强调 (hl-emphasis)
 */
function renderHighlightedText(text){
    var result=escapeHtml(text);
    result=result.replace(/\*\*(.+?)\*\*/g,'<span class="hl-bold">$1</span>');
    result=result.replace(/【★】(.+?)【\/★】/g,'<span class="hl-key">$1</span>');
    result=result.replace(/<span class="hl-important">\*\*(.+?)\*\*(.*)<\/span>/g,'<span class="hl-important">$1$2</span>');
    
    var keyPhrases=['关键在于','核心是','最重要','本质是','根本原因','值得注意的是'];
    keyPhrases.forEach(function(ph){
        result=result.replace(new RegExp(ph,'g'),'<span class="hl-emphasis">'+ph+'</span>');
    });
    
    result=result.replace(/\n\n/g,'</p><p class="pv-para">').replace(/\n/g,'<br>');
    return result;
}

// ══════════════════════════════════
//  图片生成（手动/换图）
// ══════════════════════════════════
function generateImage(i,btnElement){
    if(!currentArticle||!currentArticle.paragraphs[i]){return;}
    
    var para=currentArticle.paragraphs[i];
    var prompt=para.image_hint||(currentTopic+' 相关科技图片');
    
    // Update button state
    if(btnElement){
        btnElement.textContent='⏳ 生成中...';
        btnElement.classList.add('generating');
        btnElement.onclick=null;
    }
    
    // Show generating state in preview too
    var displayEl=document.getElementById('imgDisplay'+i);
    if(displayEl){
        displayEl.style.display='block';
        displayEl.innerHTML='<div class="img-generating">AI 正在生成图片...</div>';
    }
    
    var controller=new AbortController();
    var timer=setTimeout(function(){controller.abort();},55000);
    
    fetch('/api/image/generate',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:controller.signal,
        body:JSON.stringify({
            prompt:prompt,
            index:i,
            topic:currentTopic
        }),
    })
    .then(function(r){clearTimeout(timer);return r.json();})
    .then(function(d){
        if(btnElement){
            btnElement.textContent='🎨 重新生成';
            btnElement.classList.remove('generating');
            btnElement.onclick=function(){generateImage(i,this);};
        }
        
        if(d.success&&d.data){
            para.hasImage=true;
            para.imageUrl=d.data.url;
            
            // Show in editor
            if(displayEl){
                displayEl.style.display='block';
                displayEl.innerHTML='<img src="'+d.data.url+'" alt="配图'+(i+1)+'" style="max-width:100%;border-radius:8px">'
                    +'<div style="margin-top:4px;display:flex;gap:6px;justify-content:flex-end">'
                    +'<button class="gen-img-btn" onclick="generateImage('+i+',this)">🎨 换一张</button>'
                    +'</div>';
            }
            
            // Update preview
            renderPreview(currentArticle);
            showToast('✅ 配图生成成功！','success');
        }else{
            if(displayEl){displayEl.style.display='none';}
            showToast('⚠️ '+(d.error||'图片生成失败'),'error');
        }
    })
    .catch(function(err){
        clearTimeout(timer);
        if(btnElement){
            btnElement.textContent='🎨 生成配图';
            btnElement.classList.remove('generating');
            btnElement.onclick=function(){generateImage(i,this);};
        }
        if(displayEl){displayEl.style.display='none';}
        console.error('Image gen error:',err);
        showToast('⚠️ 图片生成超时或失败','error');
    });
}

// ══════════════════════════════════
//  Helpers
// ══════════════════════════════════
function escapeHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function updateWordCount(){
    if(!currentArticle)return;
    var total=currentArticle.paragraphs.reduce(function(s,p){return s+(p.text||'').length;},0);
    document.getElementById('wordCountInfo').textContent=total+' 字 · '+currentArticle.paragraphs.length+' 段';
}

function copyArticle(){
    if(!currentArticle){showToast('没有可复制的文章','error');return;}
    var text=currentArticle.title+'\n\n'
        +currentArticle.paragraphs.map(function(p){
            return p.text.replace(/\*\*/g,'').replace(/【★】/g,'').replace(/【\/★】/g,'');
        }).join('\n\n');
    navigator.clipboard.writeText(text).then(function(){
        showToast('✅ 已复制到剪贴板（含格式）','success');
    }).catch(function(){showToast('❌ 复制失败','error');});
}

function showToast(msg,type){
    var t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+(type||'');
    setTimeout(function(){t.classList.remove('show');},2500);
}
function showLoading(show){
    document.getElementById('loadingOverlay').classList.toggle('show',show);
}

// ══════════════════════════════════
//  Init
// ══════════════════════════════════
(function init(){
    var params=new URLSearchParams(location.search);
    var topic=params.get('topic')||params.get('t')||'';
    
    if(topic){
        document.getElementById('topicInput').value=decodeURIComponent(topic);
        setTimeout(doGenerate,500);
    }else{
        try{
            var draft=sessionStorage.getItem('draftArticle');
            if(draft){
                var data=JSON.parse(draft);
                if(data&&data.title){
                    document.getElementById('topicInput').value=data.original_topic||data.title||'';
                    document.getElementById('titleInput').value=data.title||'';
                    if(data.style){document.getElementById('styleSelect').value=data.style;}
                    currentArticle=data;
                    renderEditor(data);
                    renderPreview(data);
                    document.getElementById('infoRow').style.display='block';
                    sessionStorage.removeItem('draftArticle');
                }
            }
        }catch(e){}
    }
})();
</script>
