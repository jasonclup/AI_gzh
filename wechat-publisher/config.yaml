# 微信公众号自动发布系统 - 配置文件

# === AI 配置 ===
AI_MODEL: "gpt-4o"  # 文章生成模型
IMAGE_STYLE: "科技感、未来主义风格，无人持有产品的高质量概念图"

# === 文章生成配置 ===
ARTICLE_STYLE: "第一人称叙述，口语化，有娱乐性和吸引力"
MIN_PARAGRAPHS: 5       # 最少段落数
MAX_PARAGRAPHS: 10      # 最多段落数
WORDS_PER_PARAGRAPH: [80, 800]  # 每段字数范围（扩大方差，避免AI特征）
DAILY_ARTICLE_COUNT: [1, 1]      # 每天只发1篇，降低批量风险

# === 图片配置 ===
IMAGE_SIZE: "900x500"    # 公众号推荐配图尺寸
IMAGES_PER_ARTICLE: 4   # 每篇文章总配图上限（含封面，范围 1-4）
# 未来可扩展：优先抓取真实相关产品图/视频截图，其次再用 AI 配图兜底


# === 热点抓取源 ===
HOT_SOURCES:
  - name: "今日头条"
    url: "https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc"
    enabled: true
  - name: "百度热搜"
    url: "https://top.baidu.com/board?tab=realtime"
    enabled: true
  - name: "Tophub微博"
    url: "https://tophub.today/n/KqndgxeLl9"
    enabled: false

